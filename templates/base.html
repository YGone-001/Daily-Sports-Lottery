<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日体彩预测终端</title>
    <meta name="description" content="每日竞彩足球/篮球量化预测 - 基于Elo与泊松分布的价值投注分析">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 图表库只有赛事详情页用到，改在该页按需引入，不占首屏 -->
    <script>
    (function() {
        var stored = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', stored || 'light');
    })();
    function toggleTheme() {
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }
    </script>
</head>
<body>
    <!-- 图标 sprite：统一 24 视框、1.75 描边、跟随 currentColor。
         emoji 在不同平台字形差异大且无法着色，统一换成内联 SVG。 -->
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
        <symbol id="i-football" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M12 7.6l3.4 2.5-1.3 4h-4.2l-1.3-4z"/>
        </symbol>
        <symbol id="i-basketball" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M12 3.5v17M3.5 12h17"/>
            <path d="M6.2 6.2c3.4 3.4 3.4 8.2 0 11.6M17.8 6.2c-3.4 3.4-3.4 8.2 0 11.6"/>
        </symbol>
        <symbol id="i-flame" viewBox="0 0 24 24">
            <path d="M12 21a5.5 5.5 0 0 0 5.5-5.5c0-3.6-3.4-5.2-5.5-12.5-2.1 7.3-5.5 8.9-5.5 12.5A5.5 5.5 0 0 0 12 21z"/>
        </symbol>
        <symbol id="i-target" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="12" cy="12" r="1" style="fill:currentColor;stroke:none"/>
        </symbol>
        <symbol id="i-scale" viewBox="0 0 24 24">
            <path d="M12 4v16M7 20h10M5 8h14"/>
            <path d="M5 8l-2.5 5h5zM19 8l-2.5 5h5z"/>
        </symbol>
        <symbol id="i-coins" viewBox="0 0 24 24">
            <ellipse cx="12" cy="7.5" rx="7" ry="3"/>
            <path d="M5 7.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>
            <path d="M5 12.5v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/>
        </symbol>
        <symbol id="i-radar" viewBox="0 0 24 24">
            <path d="M12 2.8l7.9 4.6v9.2L12 21.2l-7.9-4.6V7.4z"/>
            <path d="M12 12V2.8M12 12l7.9 4.6M12 12l-7.9 4.6"/>
        </symbol>
        <symbol id="i-list" viewBox="0 0 24 24">
            <path d="M9 6h11M9 12h11M9 18h11"/>
            <path d="M4 6h1.5M4 12h1.5M4 18h1.5"/>
        </symbol>
    </svg>
    <nav class="top-nav">
        <div class="nav-inner">
            <a href="/" class="nav-brand">
                <span class="brand-mark">◈</span>
                <span class="brand-text">体彩预测终端</span>
                <span class="brand-badge">LIVE</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link {% if active_page == 'index' %}active{% endif %}">今日赛事</a>
                <a href="/strategy" class="nav-link {% if active_page == 'strategy' %}active{% endif %}">智能策略</a>
                <a href="/history" class="nav-link {% if active_page == 'history' %}active{% endif %}">历史复盘</a>
            </div>
            <div class="nav-right">
                {% if meta and meta.last_refresh %}
                <span class="sync-badge" title="数据最近同步时间：{{ meta.last_refresh[11:19] }}">
                    <span class="sync-dot"></span>
                    同步 {{ meta.last_refresh[11:16] }}
                </span>
                {% endif %}
                <span class="clock-badge" title="当前北京时间（UTC+8）">
                    <span class="clock-icon">◷</span>
                    <span id="live-clock" class="mono">--:--:--</span>
                </span>
                <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
                    <span class="icon-sun">☀</span>
                    <span class="icon-moon">☾</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p class="footer-main">概率 ≠ 结果。系统输出为模型视角，不构成投注建议。</p>
        <p class="footer-sub">数据来源 500.com · 模型基于 Elo 强度 + 泊松分布 + 赔率对撞 · 仅供研究参考</p>
    </footer>
    <script src="/static/js/app.js"></script>
</body>
</html>
