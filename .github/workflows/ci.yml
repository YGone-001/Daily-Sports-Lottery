name: CI

# Cross-platform offline CI: Ubuntu and Windows, Python 3.12.
#
# No production data, no sports-data scraping, no credentials and no private
# signing keys are present here.  Every test builds synthetic fixtures under
# pytest's temporary directories, and a production mutation additionally
# requires an Ed25519 owner approval signed with a key that CI never holds.
#
# The Windows runner is mandatory, not decorative: NTFS junction resolution is
# a Windows-only code path, so a green Linux-only run must never be taken as
# cross-platform acceptance.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline pytest suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the complete offline test suite
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee "${RUNNER_TEMP:-/tmp}/pytest-output.txt"

      - name: Report pytest totals
        if: always()
        shell: bash
        run: |
          OUTPUT="${RUNNER_TEMP:-/tmp}/pytest-output.txt"
          if [ -f "$OUTPUT" ]; then
            SUMMARY="$(tail -n 1 "$OUTPUT")"
          else
            SUMMARY="no pytest output produced (the test step failed before writing it)"
          fi
          echo "pytest [${{ matrix.os }} / Python ${{ matrix.python-version }}]: ${SUMMARY}"
          echo "::notice title=pytest totals::${{ matrix.os }} / Python ${{ matrix.python-version }}: ${SUMMARY}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### pytest - ${{ matrix.os }} / Python ${{ matrix.python-version }}"
              echo '```'
              echo "${SUMMARY}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run isolated ledger concurrency validation
        shell: bash
        run: |
          set -o pipefail
          python -m tools.shadow_ledger_concurrency_validation | tee "${RUNNER_TEMP:-/tmp}/ledger-concurrency.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("::notice title=ledger concurrency::" + json.dumps({"success":d["success"],"platform":d["platform"],"stress":d["process_stress"],"bounded_os":d["bounded_os_lock"]["outcome"],"pinned_baseline_os":d["pinned_baseline_os"]["outcome"],"windows_replace":d["windows_replace_probe"],"abrupt_append":d["abrupt_append"],"root_cause":d["windows_original_root_cause"]},sort_keys=True))' "${RUNNER_TEMP:-/tmp}/ledger-concurrency.json"

      - name: Windows NTFS junction regression must execute on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v -rs tests/test_staging_canonical_repair.py -k "ic_reg_12_windows_junction_escape_rejected" 2>&1 | tee "${RUNNER_TEMP:-/tmp}/junction-output.txt"
          if grep -q "SKIPPED" "${RUNNER_TEMP:-/tmp}/junction-output.txt"; then
            echo "::error::Windows junction regression was skipped on Windows"
            exit 1
          fi
          if ! grep -q "PASSED" "${RUNNER_TEMP:-/tmp}/junction-output.txt"; then
            echo "::error::Windows junction regression did not run"
            exit 1
          fi
          echo "Windows NTFS junction regression executed and passed."

      - name: Confirm no repository-tracked Canonical data was modified
        if: always()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            echo "::error::data/ was modified by the test run"
            git status --porcelain -- data
            exit 1
          fi
          echo "data/ untouched by the test run"

  staging-validation:
    name: Isolated Canonical repair lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # Everything below runs against a private temporary fixture generated by
      # the suite itself: no production data, no stored signing key (the owner
      # keypair is generated ephemerally into a temp directory and discarded),
      # and no network access.
      - name: Run the isolated end-to-end lifecycle validation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -m pytest -v -rs tests/test_canonical_repair_end_to_end.py 2>&1 \
            | tee "${RUNNER_TEMP:-/tmp}/staging-validation-output.txt"

      - name: Prove every required lifecycle stage executed
        if: always()
        shell: bash
        run: |
          OUT="${RUNNER_TEMP:-/tmp}/staging-validation-output.txt"
          if [ ! -f "$OUT" ]; then
            echo "::error::validation output missing; the lifecycle step did not run"
            exit 1
          fi

          # fixture created -> authorization signed -> repair executed ->
          # verification completed -> fixture destroyed
          REQUIRED="test_fixture_is_isolated_outside_the_repository test_e2e_full_lifecycle test_e2e_journal_state_machine test_e2e_crash_interruption_fails_safely test_e2e_recovery_scenario_a_rollback test_e2e_recovery_scenario_b_forward test_e2e_missing_forensic_archive_fails_closed test_e2e_no_production_path_is_touched test_fixture_is_destroyed_on_close"

          status=0
          for name in $REQUIRED; do
            if ! grep -q "${name}.*PASSED" "$OUT"; then
              echo "::error::required validation stage did not PASS: $name"
              status=1
            fi
          done
          if grep -q "SKIPPED" "$OUT"; then
            echo "::error::a staging validation test was skipped"
            status=1
          fi
          [ "$status" -eq 0 ] || exit 1

          SUMMARY="$(tail -n 1 "$OUT")"
          echo "staging validation [${{ matrix.os }} / Python ${{ matrix.python-version }}]: ${SUMMARY}"
          echo "::notice title=isolated lifecycle totals::${{ matrix.os }} / Python ${{ matrix.python-version }}: ${SUMMARY}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### isolated Canonical repair lifecycle - ${{ matrix.os }}"
              echo '```'
              echo "${SUMMARY}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Confirm no repository-tracked Canonical data was modified
        if: always()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            echo "::error::data/ was modified by the validation run"
            git status --porcelain -- data
            exit 1
          fi
          if [ -d repair_runs ]; then
            echo "::error::a repair_runs/ workspace was created in the checkout"
            exit 1
          fi
          echo "data/ untouched and no repair_runs/ workspace was created"
